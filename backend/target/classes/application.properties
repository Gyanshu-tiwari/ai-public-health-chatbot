# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/health-chatbot}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_KEY:your-secret-key-here}
jwt.expiration=900000

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MY_EMAIL}
spring.mail.password=${MY_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OpenAI Configuration
openai.api.key=${GEMINI_API_KEY}
openai.api.base-url=https://generativelanguage.googleapis.com/v1beta/openai/

# Logging
logging.level.com.healthchat=DEBUG
logging.level.org.springframework.security=DEBUG
